spring.application.name=url-shortner
spring.datasource.url=jdbc:sqlite:data/urls.db
spring.sql.init.mode=always
# Use snake_case names in JSON (short_url, delete_token), to match the Python API and the web page.
spring.jackson.property-naming-strategy=SNAKE_CASE
# The address short links are built from. Change this when you deploy.
app.base-url=http://localhost:8080
# How many links one visitor (IP address) may create per minute. 0 turns the limit off.
app.rate-limit-per-minute=30
# The furthest ahead an expiry time may be, in days.
app.max-expiry-days=365
