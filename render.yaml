# Render Blueprint: creates the web service and a PostgreSQL database together.
# In the Render dashboard choose New > Blueprint and select this repository.
# Spec: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: url-shortener
    runtime: docker
    plan: free
    region: singapore          # closest Render region to India; change if you like
    healthCheckPath: /health
    autoDeploy: true           # redeploy on every push to the default branch
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: url-shortener-db
          property: connectionString
      # Render puts a proxy in front of the app, so read the visitor's IP from
      # X-Forwarded-For for rate limiting.
      - key: TRUST_PROXY_HEADERS
        value: "true"
      # BASE_URL is not needed: the app uses Render's RENDER_EXTERNAL_URL
      # (https://<name>.onrender.com). Set BASE_URL only for a custom domain.
      #
      # Recommended: give your deployment its own code constants. Add these in
      # the dashboard (Environment tab) BEFORE creating any links, then never
      # change them. The multiplier must be odd and not divisible by 31.
      - key: ID_SCRAMBLE_MULTIPLIER
        sync: false
      - key: ID_SCRAMBLE_OFFSET
        sync: false

databases:
  - name: url-shortener-db
    plan: free                 # free databases expire after 30 days (see README)
    region: singapore
    databaseName: shortener
    user: shortener
