name: Java CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        run: ./mvnw -B test

  docker:
    name: Build and smoke-test the container
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t url-shortener-java .
      - name: Start the container and check /health
        run: |
          docker run -d --name app -p 8080:8080 url-shortener-java
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/health && exit 0
            sleep 1
          done
          docker logs app
          exit 1
